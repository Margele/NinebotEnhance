name: Build and Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Test release automation
        run: python3 -m unittest discover -s tests/python -v
      - name: Create temporary CI signing key
        run: python3 scripts/create_signing_key.py --jdk "$JAVA_HOME" --output-dir "$RUNNER_TEMP/ninebot-ci-signing"
      - name: Compile, test and verify APK
        run: >-
          python3 scripts/build.py --sdk "$ANDROID_HOME" --jdk "$JAVA_HOME"
          --keystore "$RUNNER_TEMP/ninebot-ci-signing/release.jks"
          --password-file "$RUNNER_TEMP/ninebot-ci-signing/password.txt"
          --allow-other-signer
      - name: Verify Gradle build
        run: bash gradlew :app:assembleDebug --no-daemon
      - name: Package CI artifacts
        run: python3 scripts/package_artifacts.py --kind ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NinebotEnhance-ci-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/ci/
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/ninebot-ci-signing/release.jks" "$RUNNER_TEMP/ninebot-ci-signing/password.txt" "$RUNNER_TEMP/ninebot-ci-signing/certificate.der"

  release:
    name: Build and publish release
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: release
    concurrency:
      group: publish-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Test release automation
        run: python3 -m unittest discover -s tests/python -v
      - name: Restore release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          key, password = os.environ.get('RELEASE_KEYSTORE_BASE64'), os.environ.get('RELEASE_KEYSTORE_PASSWORD')
          if not key or not password:
              raise SystemExit('The release environment requires both signing secrets.')
          folder = Path(os.environ['RUNNER_TEMP']) / 'ninebot-release-signing'
          folder.mkdir(mode=0o700)
          (folder / 'release.jks').write_bytes(base64.b64decode(key, validate=True))
          (folder / 'password.txt').write_text(password.rstrip('\r\n') + '\n', encoding='utf-8')
          for path in folder.iterdir():
              path.chmod(0o600)
          PY
      - name: Compile, test and verify official signing certificate
        run: >-
          python3 scripts/build.py --sdk "$ANDROID_HOME" --jdk "$JAVA_HOME"
          --keystore "$RUNNER_TEMP/ninebot-release-signing/release.jks"
          --password-file "$RUNNER_TEMP/ninebot-release-signing/password.txt"
      - name: Verify Gradle build
        run: bash gradlew :app:assembleDebug --no-daemon
      - name: Package APK, source and checksums
        run: python3 scripts/package_artifacts.py --kind release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NinebotEnhance-release-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py
      - name: Remove release signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/ninebot-release-signing/release.jks" "$RUNNER_TEMP/ninebot-release-signing/password.txt"
